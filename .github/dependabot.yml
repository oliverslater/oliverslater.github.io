version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 30
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Group all the updates in a single PR, except sensitive packages
      # (typescript/astro) that get their own PR for manual review, since
      # major bumps there have broken `astro check` in the past.
      all-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "astro"
          - "@astrojs/*"
    cooldown:
      default-days: 7
      semver-major-days: 30