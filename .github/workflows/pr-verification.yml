name: Pull Request Verification

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify PR Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Secret Security Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check code formatting
        run: npm run format:check

      - name: Run test suite & validation checks
        run: npm run validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check distributed licence notices
        run: npm run licenses:check

      # Restore credential API response cache before the build so the Astro build
      # can reuse cached responses from previous runs.
      - name: Restore credentials API cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/credentials
          key: credentials-cache-${{ github.run_id }}
          restore-keys: |
            credentials-cache-

      - name: Build static site
        run: npm run build

      - name: Validate HTML & check broken links
        run: npm run check:links

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Playwright Tests
        run: npm run test:e2e

      - name: Upload Test Report & Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-results-pr
          path: |
            test-results/
            html/
            coverage/
            playwright-report/
          retention-days: 7
