name: Dependabot Build Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: dependabot-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Dependabot update
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schemas, hygiene, and Astro code
        run: npm run validate

      - name: Check formatting
        run: npm run format:check

      - name: Check distributed license notices
        run: npm run licenses:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build site
        run: npm run build

      - name: Verify static artifact
        run: test -f dist/index.html && test -f dist/sitemap.xml
