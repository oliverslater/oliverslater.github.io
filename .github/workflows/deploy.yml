name: Deploy Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *" # Runs daily at 06:00 UTC to publish scheduled posts & refresh credentials
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Gated Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Secret Security Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e #v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Validate Schemas, Markdown & Hygiene
        run: npm run validate

      - name: Cache credentials API responses
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: node_modules/.cache/credentials
          key: credentials-cache-${{ github.run_id }}
          restore-keys: |
            credentials-cache-

      - name: Build site
        env:
          PUBLIC_FORM_ENDPOINT: ${{ secrets.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_HCAPTCHA_SITEKEY: ${{ secrets.PUBLIC_HCAPTCHA_SITEKEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          FORCE_REFRESH_CERTS: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: npm run build

      - name: Validate HTML & Check Broken Links
        run: npm run check:links

      - name: Pre-compress Static Assets (Gzip & Brotli)
        run: npm run compress

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5.0.0
        with:
          path: ./dist

      - name: Publish dist to deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy: ${{ github.sha }}"
          git branch -M deploy
          git push -f https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git deploy

      - name: Trigger cPanel Webhook
        if: env.CPANEL_WEBHOOK_URL != ''
        env:
          CPANEL_WEBHOOK_URL: ${{ secrets.CPANEL_WEBHOOK_URL }}
        run: |
          echo "Triggering cPanel deployment webhook..."
          curl -s -f -X GET "$CPANEL_WEBHOOK_URL" || echo "cPanel webhook trigger failed"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 #v5.0.1
