media:
  input: public/assets
  output: /assets

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    view:
      fields: [title, pubDate, lastUpdated, draft]
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: pubDate
        label: Publication Date
        type: date
        required: true
      - name: lastUpdated
        label: Last Updated Date
        type: date
        description: "Optional. Set when tweaking an existing post after publishing. Cannot be earlier than Publication Date."
      - name: heroImage
        label: Hero Image
        type: image
      - name: categories
        label: Categories
        type: string
        list: true
        options:
          - Cloud Architecture
          - Enterprise Strategy
          - Platform Engineering
          - DevSecOps
          - Governance
          - Homelab
          - Edge Computing
          - Self-Hosted
          - IoT & Automation
          - Experiments
        description: "Primary architectural or tinkering pillars. Drives the filter pills on /blog."
      - name: tags
        label: Tags (Hashtags)
        type: string
        list: true
        description: "Freeform technical tags & hashtags for search, SEO, and card badges. Must be Title Case (e.g. AWS, Terraform, High Availability, Disaster Recovery). Max 35 chars."
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body Content
        type: rich-text

  - name: profile
    label: CV Profile
    type: file
    path: src/content/cv/profile.json
    fields:
      - name: name
        label: Full Name
        type: string
        required: true
      - name: title
        label: Professional Title
        type: string
        required: true
      - name: avatar
        label: Profile Picture / Avatar
        type: image
      - name: email
        label: Email Address (optional / private via .env CONTACT_EMAIL)
        type: string
      - name: showEmail
        label: Show Email Address on CV (if false, displays link to Contact Form)
        type: boolean
        default: false
      - name: location
        label: Location
        type: string
      - name: metaDescription
        label: Meta Description (SEO preview / meta tag)
        type: text
      - name: bio
        label: Bio / Summary
        type: text
      - name: website
        label: Website
        type: string
      - name: github
        label: GitHub URL
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: twitter
        label: Twitter / X URL
        type: string
      - name: headline
        label: Headline Badge (e.g. AWS Golden Jacket Holder · 11x AWS Certified)
        type: string
      - name: credly
        label: Credly Profile URL
        type: string
      - name: mslearn
        label: Microsoft Learn Transcript URL
        type: string
      - name: coreCompetencies
        label: Core Competencies
        type: string
        list: true

  - name: pageSeo
    label: Page SEO & SERP Snippets
    type: file
    path: src/content/page-seo.json
    fields:
      - name: home
        label: Homepage SERP
        type: object
        fields:
          - name: title
            label: Title Tag
            type: string
            required: true
          - name: description
            label: Meta Description
            type: text
            required: true
      - name: cv
        label: CV Page SERP
        type: object
        fields:
          - name: title
            label: Title Tag
            type: string
            required: true
          - name: description
            label: Meta Description
            type: text
            required: true
      - name: contact
        label: Contact Page SERP
        type: object
        fields:
          - name: title
            label: Title Tag
            type: string
            required: true
          - name: description
            label: Meta Description
            type: text
            required: true
      - name: blog
        label: Blog Index SERP
        type: object
        fields:
          - name: title
            label: Title Tag
            type: string
            required: true
          - name: description
            label: Meta Description
            type: text
            required: true

  - name: experience
    label: CV Experience
    type: file
    path: src/content/cv/experience.json
    fields:
      - name: roles
        label: Work Roles
        type: object
        list: true
        fields:
          - name: id
            label: ID
            type: string
          - name: role
            label: Job Title
            type: string
            required: true
          - name: company
            label: Company Name
            type: string
            required: true
          - name: companyUrl
            label: Company Website
            type: string
          - name: location
            label: Location
            type: string
          - name: startDate
            label: Start Date
            type: string
            required: true
          - name: endDate
            label: End Date
            type: string
          - name: current
            label: Currently Employed Here
            type: boolean
          - name: description
            label: Short Description
            type: text
          - name: highlights
            label: Achievements / Highlights
            type: string
            list: true
          - name: technologies
            label: Technologies Used
            type: string
            list: true

  - name: skills
    label: CV Skills
    type: file
    path: src/content/cv/skills.json
    fields:
      - name: categories
        label: Skill Categories
        type: object
        list: true
        fields:
          - name: category
            label: Category Name
            type: string
          - name: skills
            label: Skill List
            type: string
            list: true

  - name: deliverables
    label: What I Deliver (Homepage Pillars)
    type: file
    path: src/content/cv/deliverables.json
    fields:
      - name: pillars
        label: Architecture Capability Pillars
        type: object
        list: true
        fields:
          - name: category
            label: Pillar Category Name
            type: string
            required: true
          - name: icon
            label: Icon Identifier (cloud, code, box, zap, shield)
            type: string
          - name: items
            label: Key Value Deliverables
            type: string
            list: true

  - name: featured-credentials
    label: Featured Credentials (Homepage Signals)
    type: file
    path: src/content/cv/featured-credentials.json
    fields:
      - name: featured
        label: Featured Credentials
        type: object
        list: true
        fields:
          - name: id
            label: Unique ID
            type: string
            required: true
          - name: title
            label: Credential Title
            type: string
            required: true
          - name: issuer
            label: Issuer Badge (e.g. AWS Pro · 11x)
            type: string
            required: true
          - name: description
            label: Summary Description
            type: text
            required: true
          - name: provider
            label: Provider / Icon
            type: string
            options:
              - aws
              - azure
              - terraform
          - name: url
            label: Custom Verification URL (optional)
            type: string

  - name: technologies
    label: Core Technologies & Tools
    type: file
    path: src/content/technologies.json
    fields:
      - name: technologies
        label: Technologies
        type: object
        list: true
        fields:
          - name: name
            label: Technology Name
            type: string
            required: true
          - name: tag
            label: Capability Tag / Distinction
            type: string
            required: true
          - name: logo
            label: Logo SVG Path (e.g. /svg/aws.svg)
            type: string

  - name: education
    label: Offline Credential Fallback
    type: file
    path: src/content/cv/education.json
    fields:
      - name: qualifications
        label: Qualifications
        type: object
        list: true
        fields:
          - name: title
            label: Qualification Title
            type: string
            required: true
          - name: issuer
            label: Issuer
            type: string
            required: true
          - name: level
            label: Level
            type: string
          - name: validity
            label: Validity
            type: string
            required: true
          - name: badgeImageUrl
            label: Badge Image URL (optional)
            type: string
          - name: verifyUrl
            label: Verification URL (optional)
            type: string
          - name: displayed
            label: Display when used as fallback
            type: boolean
            default: true
          - name: includeInCount
            label: Include in count when used as fallback
            type: boolean
            default: true
          - name: priority
            label: Priority (higher number first)
            type: number
            default: 0

  - name: manual-certifications
    label: Non-Credly Credentials
    type: file
    path: src/content/cv/manual-certifications.json
    fields:
      - name: certifications
        label: Certifications
        type: object
        list: true
        fields:
          - name: id
            label: Unique ID (slug)
            type: string
            required: true
          - name: title
            label: Credential Title
            type: string
            required: true
          - name: issuer
            label: Issuer (e.g. Microsoft, Linux Foundation)
            type: string
            required: true
          - name: issueDate
            label: Issue Date (e.g. Jan 2025)
            type: string
            required: true
          - name: expiresDate
            label: Expiry Date (optional)
            type: string
          - name: badgeImageUrl
            label: Badge Image URL (e.g. https://... or /assets/...)
            type: string
          - name: verifyUrl
            label: Verification / Transcript URL
            type: string
            required: true
          - name: displayed
            label: Display in CV
            type: boolean
            default: true
          - name: includeInCount
            label: Include in Credential Count
            type: boolean
            default: true
          - name: priority
            label: "Priority (higher number = displayed first, default: 0)"
            type: number
            default: 0

  - name: certification-settings
    label: Credential Visibility & Count Toggles
    type: file
    path: src/content/cv/certification-settings.json
    fields:
      - name: overrides
        label: Credential Visibility & Count Overrides
        type: object
        list: true
        fields:
          - name: title
            label: Certification Title (or keyword)
            type: string
            required: true
          - name: displayTitle
            label: Friendly Display Title (optional rename)
            type: string
          - name: displayed
            label: Display on Website
            type: boolean
            default: true
          - name: includeInCount
            label: Include in Headline Count
            type: boolean
            default: true
          - name: priority
            label: "Priority (higher number = displayed first; default 0)"
            type: number
            default: 0
          - name: order
            label: "Display order (alternative to priority)"
            type: number
          - name: issueDate
            label: "Issue Date Override"
            type: string
          - name: expiresDate
            label: "Expiry Date Override (e.g. 'Jan 2028' or 'Never')"
            type: string
          - name: verifyUrl
            label: "Custom Verification URL"
            type: string
          - name: imageUrl
            label: "Custom Badge Image URL"
            type: string
          - name: issuer
            label: "Issuer Label (e.g. AWS, Microsoft)"
            type: string
